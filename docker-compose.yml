version: "3.8"

services:
  grafana:
    container_name: monitoring-grafana
    image: grafana/grafana:latest
    hostname: rpi-grafana
    restart: unless-stopped
    user: "472"
    networks:
      - internal
    ports:
      - "3000:3000"
    env_file:
      - ./grafana/.env
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus

  cadvisor:
    container_name: monitoring-cadvisor
    image: gcr.io/cadvisor/cadvisor:latest
    hostname: rpi-cadvisor
    restart: unless-stopped
    privileged: true
    networks:
      - internal
    expose:
      - 8080
    command:
      - '-housekeeping_interval=15s'
      - '-docker_only=true'
      - '-store_container_labels=false'
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /etc/machine-id:/etc/machine-id:ro

  node-exporter:
    container_name: monitoring-node-exporter
    image: prom/node-exporter:latest
    hostname: rpi-exporter
    restart: unless-stopped
    networks:
      - internal
    expose:
      - 9100
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host
      - --collector.filesystem.ignored-mount-points
      - ^/(sys|proc|dev|host|etc|rootfs/var/lib/docker/containers|rootfs/var/lib/docker/overlay2|rootfs/run/docker/netns|rootfs/var/lib/docker/aufs)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /:/host:ro,rslave

  otel-collector:
    container_name: monitoring-otel-collector
    image: otel/opentelemetry-collector-contrib:latest
    hostname: rpi-otel-collector
    restart: unless-stopped
    networks:
      - internal
      - monitoring
    expose:
      - 4317  # OTLP gRPC receiver
      - 4318  # OTLP HTTP receiver
      - 8888  # Prometheus metrics exposed by the collector
      - 8889  # Prometheus exporter metrics
    ports:
      - "4317:4317"  # Expose OTLP gRPC for external .NET API
      - "4318:4318"  # Expose OTLP HTTP for external .NET API
    volumes:
      - ./otel-collector/otel-collector-config.yaml:/etc/otelcol-contrib/otel-collector-config.yaml
    command: ["--config=/etc/otelcol-contrib/otel-collector-config.yaml"]

  prometheus:
    container_name: monitoring-prometheus
    image: prom/prometheus:latest
    hostname: rpi-prometheus
    restart: unless-stopped
    user: "nobody"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=1m'
      - '--storage.tsdb.retention.size=5GB'
    networks:
      - internal
    expose:
      - 9090
    volumes:
      - ./prometheus:/etc/prometheus/
    depends_on:
      - cadvisor
      - node-exporter
      - otel-collector
    links:
      - cadvisor:cadvisor
      - node-exporter:node-exporter
      - otel-collector:otel-collector

networks:
  internal:
    driver: bridge
  # Shared network for external applications
  monitoring:
    driver: bridge
    external: false